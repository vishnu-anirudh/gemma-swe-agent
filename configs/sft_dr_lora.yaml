# Dynamic Rank LoRA (DR-LoRA) SFT Configuration
model:
  name_or_path: "google/gemma-2-2b-it"
  torch_dtype: "bfloat16"
  device: "mps"  # Apple Silicon Metal Performance Shaders

peft:
  type: "dr_lora"
  initial_rank: 8
  max_rank: 64
  min_rank: 2
  lora_alpha: 16.0
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  saliency:
    alpha: 0.5   # Weight for routing/activation frequency
    beta: 0.5    # Weight for Frobenius norm of gradients
    reallocate_every_n_steps: 50

training:
  learning_rate: 2.0e-4
  batch_size: 1
  gradient_accumulation_steps: 4
  max_length: 2048
  max_steps: 500
  warmup_steps: 25
  save_steps: 100
  logging_steps: 10
  step_level_error_masking: true
